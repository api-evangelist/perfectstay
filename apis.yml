name: PerfectStay
description: 'PerfectStay is a French online travel company that sells curated flight-plus-hotel
  packages, all-inclusive stays, guided tours, city breaks and standalone flights, hotels, activities
  and transfers, marketed around a best-price guarantee (refunding twice any price difference), trip
  protection and 24/7 customer support, with installment payment options (2x/4x). Founded in Paris and
  backed by Partech, it also powers private, brand-operated travel-club sale sites. The company exposes
  no public developer platform, API, SDK or documentation surface; this profile captures its public
  web and security posture within the API Evangelist network.'
